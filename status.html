<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadre · Status</title><meta name="description" content="Live status of the Cadre website, API, scheduler, Solana RPC, market data, leaderboard, payments and alerts.">
<meta name="theme-color" content="#0B0B10"><link rel="icon" href="icons/icon-192.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.cadre-us.org https://api.coingecko.com http://localhost:8080 http://127.0.0.1:8080; base-uri 'none'; form-action 'none'">
<style>
:root{--bg:#0B0B10;--card:#14141A;--line:#2A2A36;--tx:#F2F0FA;--mut:#A9A6BC;--pur:#9A6BFF;--ok:#3DDC97;--warn:#FFC857;--bad:#FF5D73;--off:#5B5870}
@media(prefers-color-scheme:light){:root{--bg:#F6F5FB;--card:#fff;--line:#DEDBEA;--tx:#16151F;--mut:#5C5973;--pur:#6B3FE0;--ok:#12A666;--warn:#B47A00;--bad:#D12F48;--off:#9A97AE}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em}.brand img{width:34px;height:34px}.brand span{color:var(--mut);font-weight:500}
.sol{font:500 13px ui-monospace,"JetBrains Mono",monospace;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}.sol b{color:var(--tx);font-weight:500}.up{color:var(--ok)}.down{color:var(--bad)}
.banner{border-radius:18px;padding:22px 24px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:16px;margin-bottom:26px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--off);flex:none;box-shadow:0 0 0 0 transparent}.dot.operational{background:var(--ok);box-shadow:0 0 14px color-mix(in srgb,var(--ok) 60%,transparent)}.dot.degraded{background:var(--warn)}.dot.down,.dot.outage{background:var(--bad)}
.banner h1{font-size:24px;line-height:1.2}.banner p{color:var(--mut);font-size:14px;margin-top:2px}
h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--pur);margin:30px 0 12px;font-weight:600}
.comp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:12px}.top .nm{font-weight:600;flex:1}.top .st{font-size:14px;color:var(--mut)}.top .st.operational{color:var(--ok)}.top .st.degraded{color:var(--warn)}.top .st.down{color:var(--bad)}
.det{font-size:13px;color:var(--mut);margin:2px 0 10px 26px}
.bars{display:flex;gap:2px;height:30px;align-items:stretch}.bars i{flex:1;border-radius:2px;background:var(--line);min-width:1px}.bars i.g{background:var(--ok)}.bars i.y{background:var(--warn)}.bars i.r{background:var(--bad)}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.inc{border-left:3px solid var(--line);padding:4px 0 4px 14px;margin-bottom:14px}.inc.open{border-color:var(--bad)}.inc b{display:block}.inc small{color:var(--mut)}
.empty{color:var(--mut);font-size:14px}.tag{font-size:12px;color:var(--warn);margin-top:8px}
footer{margin-top:40px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}footer a{color:var(--pur);text-decoration:none}
@media(max-width:520px){.banner h1{font-size:20px}.bars{height:24px}}
</style></head><body><div class="wrap">
<header><div class="brand"><img src="brand/cadre-mark-gradient.svg" alt=""><div>CADRE <span>Status</span></div></div><div class="sol" id="sol" title="SOL price">SOL <b id="sol-px">–</b> <span id="sol-chg"></span></div></header>
<div class="banner"><div class="dot" id="odot"></div><div><h1 id="otitle">Checking…</h1><p id="osub"></p></div></div>
<h2>Components</h2><div id="comps"></div>
<h2>Incidents · last 30 days</h2><div id="incs"><p class="empty">Loading…</p></div>
<footer><span id="upd"></span><span><a href="./">Back to Cadre</a></span></footer>
</div><script src="config.js"></script><script src="status.js"></script></body></html>
